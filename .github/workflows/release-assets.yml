name: build-and-release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'  # 使用 Node.js 22 版本

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来创建发布

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史记录

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # 仓库不提交 lock 文件（.gitignore /yarn.lock），setup-node 的
          # cache 需要 lock 才能工作——v2.0.3 起每个 tag 都挂在这，勿加回

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install dependencies
        # 无 lock 文件不能 npm ci；--omit=dev：树版打包只需生产依赖，
        # devDeps（rolldown/@inquirer 等）会被 package-clean 的 staging 自检拦截
        run: npm install --omit=dev --no-audit --no-fund

      - name: Run packageJS script
        run: npm run packageJS

      - name: Run packageJS-green script
        run: npm run packageJS-green

      # 资产在仓库上级目录（package-clean 的 staging 旁）；gh 需 -R 显式仓库
      # （cwd 已脱离 git 仓库）。幂等：release 已存在则只补传资产（支持重跑/重推 tag）。
      # 旧实现挂点：create-release@v1 已存在即失败；curl 拼 upload_url 带裸
      # {?name,label} 后缀 + --data-binary 非 multipart，从未上传成功过
      - name: Create release and upload 7z assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ..
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME 已存在，仅上传资产"
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" drpy-node-*.7z --clobber
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" drpy-node-*.7z --title "Release $GITHUB_REF_NAME"
          fi